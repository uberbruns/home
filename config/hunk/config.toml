theme = "aura-dark"
mode = "stack"
line_numbers = true
wrap_lines = false
hunk_headers = true
menu_bar = true
agent_notes = false
copy_decorations = false
cursor_line = "row"


# Aura Dark, ported from daltonmenezes/aura-theme.
#
# The surface colors come from packages/vscode/themes/aura-dark-color-theme.json.
# The base is github-dark-default because its default (unscoped) token color
# #e6edf3 is the closest bundled match to Aura's foreground #edecee, and
# syntax_scopes cannot override a base theme's unscoped default rule.
#
# Aura expresses its diff backgrounds with alpha (#00d89023, #ff474720), which
# hunk rejects. Each value below is that color composited over the editor
# background #15141b.
[themes.aura-dark]
base = "github-dark-default"
label = "Aura Dark"

# Chrome surfaces: editor.background, sideBar.background,
# list.activeSelectionBackground, dropdown.border.
background = "#15141b"
panel = "#110f18"
panelAlt = "#2e2b38"
border = "#3b334b"

# accent1 drives Aura's cursor, badges, and active-selection foreground.
# accentMuted is accent22, which Aura uses for inactive slider surfaces.
accent = "#a277ff"
accentMuted = "#4d466e"
text = "#edecee"
muted = "#adacae"

# Row tints, then the stronger content tints applied inside changed regions.
addedBg = "#122f2b"
removedBg = "#321a21"
addedContentBg = "#104739"
removedContentBg = "#522126"

# Aura has no moved-line color, so both moved tints reuse its modified color
# #ffca85 from editorGutter.modifiedBackground.
movedAddedBg = "#362d2a"
movedRemovedBg = "#362d2a"

# Context rows stay on the plain editor background, matching Aura's editor.
contextBg = "#15141b"
contextContentBg = "#15141b"

# Gutter marker colors are Aura's editorGutter added and deleted backgrounds.
addedSignColor = "#61ffca"
removedSignColor = "#ff6767"

# Aura's editorLineNumber.foreground #a394f033 composites to #312e46, which is
# unreadable as a foreground. This keeps that hue at a legible luminance.
lineNumberBg = "#15141b"
lineNumberFg = "#877ac5"

# hunk blends selectedHunk over each row background, so this is Aura's
# primary-selection color with its alpha channel dropped.
selectedHunk = "#3d375e"

badgeAdded = "#61ffca"
badgeRemoved = "#ff6767"
badgeNeutral = "#adacae"

# File status colors follow Aura's gitDecoration entries. Aura defines no
# renamed color, so fileRenamed uses accent32 to stay distinct from modified.
fileNew = "#61ffca"
fileDeleted = "#ff6767"
fileRenamed = "#82e2ff"
fileModified = "#ffca85"
fileUntracked = "#61ffca"

noteBorder = "#a277ff"
noteBackground = "#211d26"
noteTitleBackground = "#2e2b38"
noteTitleText = "#edecee"

# Shiki/TextMate scopes.
#
# Declaration order matters: equally specific rules resolve last-wins, and a
# more specific selector in github-dark-default beats a broader override here.
# Each group therefore lists its broad selectors first, and every specific
# selector the base theme defines is repeated explicitly so nothing inherits a
# GitHub color.
[themes.aura-dark.syntax_scopes]

# accent7 as the root fallback. The base theme's default rule carries no scope,
# so no override can replace it; these two root selectors claim every token the
# grammars leave otherwise unscoped, which is what keeps GitHub's #e6edf3 out of
# whitespace and bare identifiers. Both are the least specific selectors in the
# table, so every rule below still wins over them.
"source" = "#edecee"
"text" = "#edecee"

# accent8 — comments and diff metadata.
"comment" = "#6d6d6d"
"comment.line" = "#6d6d6d"
"comment.line.double-slash" = "#6d6d6d"
"comment.line.number-sign" = "#6d6d6d"
